[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nargiza-brend-bot"
version = "0.0.1"
description = "Nargiza Brend do'koni uchun Telegram bot: qarz daftari, savdo, ombor"
readme = "README.md"
requires-python = ">=3.12,<3.15"
# Versiyalar 2026-11-11 da PyPI'dan tekshirilib qotirildi.
# Eslatma: aiogram 3.31.0 pydantic<2.14 talab qiladi, shuning uchun pydantic 2.13.5.
dependencies = [
    "aiogram==3.31.0",
    "google-genai==3.1.0",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "apscheduler==3.11.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.16.2",
    "openpyxl==3.1.5",
    "rapidfuzz==3.14.6",
    "structlog==26.1.0",
    "tzdata==2026.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "testcontainers[postgres]==4.15.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import tartibi
    "B",             # bugbear — keng tarqalgan xatolar
    "UP",            # zamonaviy Python sintaksisi
    "S",             # bandit — xavfsizlik
    "ASYNC",         # async xatolar
    "DTZ",           # timezone'siz datetime taqiqlanadi
    "SIM", "RUF",
]
# RUF001-003: kirill harflari va o'zbek apostroflari (ʻ ʼ) ataylab ishlatiladi
# E501: kod uzunligini ruff format boshqaradi; uzun o'zbekcha izohlar ruxsat
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # testlarda assert va soxta parollar ruxsat

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: haqiqiy Postgres talab qiladi (testcontainers)",
]
