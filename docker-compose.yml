# Ishlab chiqish (dev) muhiti: bot + postgres.
# Ishga tushirish: docker compose up --build
name: nargiza-brend

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da bo'lishi kerak}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Tashkent
    volumes:
      # Postgres 18 dan boshlab ma'lumot /var/lib/postgresql/<versiya>/ ichida,
      # shuning uchun volume /var/lib/postgresql ga ulanadi.
      - pgdata:/var/lib/postgresql
    ports:
      # Faqat dev: faqat shu kompyuterdan (127.0.0.1) kirish — tashqi tarmoqqa ochilmaydi.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
