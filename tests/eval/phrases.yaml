# Evaluation set for the AI agent (Uzbek: Latin + Cyrillic, dialect, numbers in words, mixed requests).
# Fake names only. Run against the real model:  .venv/bin/python scripts/run_eval.py
#
# expect: list of tool calls in order. Checked fields (all optional except tool):
#   customer  – substring of the customer words (compared after Latin/lowercase normalisation)
#   amount    – integer so'm; compared AFTER our own parser reads the model's amount_text
#   section   – shop | lingerie
#   item      – product type name; the model's words must resolve to it in our category resolver
#   items     – [{cat, qty, price}] for debts
#   due       – "none" | "1w" | "2w" | "1m" | "date" | "unset" (model must leave it empty)
#   all       – write_off all=true
# Tools that must not guess are expected as `ask` when information is missing.

- say: "Umida opa 100 ming berdi"
  expect: [{tool: add_payment, customer: umida, amount: 100000}]
- say: "Umida 100 ming berdi"
  expect: [{tool: add_payment, customer: umida, amount: 100000}]
